services:
  postgres:
    image: postgres:16
    container_name: kgm-postgres
    environment:
      POSTGRES_DB: knowledge_gap_miner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_gap_miner"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kgm-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
